[package]
name = "gesturecraft"
version = "0.4.0"
edition = "2021"
description = "A native Windows mouse-gesture tool with an original Rust implementation. Inspired by the feature concepts of WGestures 2; no original code or assets are used."
license = "MIT"

[dependencies]
eframe = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rhai = { version = "1", features = ["sync"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winuser",
    "windef",
    "winnt",
    "minwindef",
    "winbase",
    "libloaderapi",
    "processthreadsapi",
    "handleapi",
    "impl-default",
] }

[profile.release]
opt-level = 3
lto = true
strip = true
